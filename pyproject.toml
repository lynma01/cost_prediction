[project]
name = "cost-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=5.5.0",
    "duckdb>=1.3.1",
    "anthropic>=0.52.0",
    "python-dotenv>=1.1.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "requests>=2.32.4",
    "pyyaml>=6.0.3",
    "nbformat>=5.10.4",
    "nbclient>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "playwright>=1.52.0",
]

[tool.setuptools.packages.find]
include = ["cost_pred*"]
